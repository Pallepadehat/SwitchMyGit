name: CI

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    name: SwitchMyGitKit tests
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
      - name: Configure Git for tests
        run: |
          git config --global user.name "CI"
          git config --global user.email "ci@example.com"
      - name: Run tests
        working-directory: Packages/SwitchMyGitKit
        run: swift test

  install-script:
    name: Check install.sh
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
      - name: Syntax check
        run: bash -n install.sh && zsh -n scripts/*.sh

  build:
    name: Build app
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
      - uses: maxim-lobanov/setup-xcode@v1
        with:
          xcode-version: latest-stable
      # The project uses Xcode 27's project format, which older Xcode versions
      # can't open. Skip (with a notice) until the runners have Xcode 27.
      - name: Check the Xcode version
        id: xcode
        run: |
          major=$(xcodebuild -version | head -1 | awk '{print $2}' | cut -d. -f1)
          if [ "$major" -ge 27 ]; then
            echo "supported=true" >> "$GITHUB_OUTPUT"
          else
            echo "::notice title=App build skipped::The project needs Xcode 27 or later; this runner has Xcode $major."
            echo "supported=false" >> "$GITHUB_OUTPUT"
          fi
      - name: Build
        if: steps.xcode.outputs.supported == 'true'
        run: |
          xcodebuild build \
            -project MacGitSwitcher.xcodeproj \
            -scheme MacGitSwitcher \
            -configuration Release \
            -destination 'platform=macOS' \
            CODE_SIGNING_ALLOWED=NO
