name: Bug report
description: Something doesn't work as expected
labels: [bug]
body:
  - type: textarea
    id: what-happened
    attributes:
      label: What happened?
      description: What you did, what you expected, and what happened instead.
    validations:
      required: true
  - type: input
    id: macos
    attributes:
      label: macOS version
      placeholder: "macOS 27.2"
    validations:
      required: true
  - type: input
    id: git
    attributes:
      label: Git version
      description: Output of `git --version`
    validations:
      required: true
  - type: textarea
    id: config
    attributes:
      label: Relevant Git configuration
      description: Output of `git config --list --show-origin --show-scope | grep -E 'user\.|include'`. Remove private values.
      render: shell
